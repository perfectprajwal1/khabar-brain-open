name: Khabar Brain demo panel test
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-panel:
    name: Capture public site demo (top panel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Pillow
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Record and auto-zoom the demo
        run: python scripts/capture_demo.py demo_top.mp4
      - name: Validate
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,duration -of compact demo_top.mp4
          ffmpeg -v error -xerror -i demo_top.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: demo-top
          path: demo_top.mp4
          if-no-files-found: error
          retention-days: 3
